name: Update README
on:
  push:
    paths: ["solutions/**", "neetcode150.json", "lc.py"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, used to date each solution
      - run: python3 lc.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md .difficulty.json
          git diff --cached --quiet || (git commit -m "chore: update README" && git push)
